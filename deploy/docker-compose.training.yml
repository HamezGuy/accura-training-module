# Build this repository's Dockerfile separately and select the resulting image digest.
# The environment file owns the existing DATABASE_*, ACCURA_API_* and CORS settings.
# Run one instance until expiration scheduling has distributed ownership.
services:
  training:
    image: ${TRAINING_SERVICE_IMAGE:?Select the qualified training image by digest}
    env_file: ${TRAINING_ENV_FILE:-/etc/accuratrial/training.env}
    environment:
      NODE_ENV: production
      PORT: "3002"
    ports:
      - "127.0.0.1:${TRAINING_PORT:-3002}:3002"
    networks: [native-services]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    healthcheck:
      # Liveness only. Qualify native authority and database access separately.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  native-services:
    external: true
    name: ${TRAINING_SERVICE_NETWORK:?Select the existing network reaching the native API and training database}
